<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,700&family=Kumbh+Sans:YOPQ@300&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,700&family=Kumbh+Sans:wght,YOPQ@700,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Profile card component</title>
</head>
<body>
<div class="bgbody">
  <section class="card">
    <div class="imagenes">
      <img src="images/bg-pattern-card.svg" class="bg">
      <img src="images/image-victor.jpg" class="image">
    </div>
    
    <div class="texts">
      <h2 class="name">Victor Crest</h2>
      <h3 class="age">26</h3>
      <p class="ciudad">London</p>
    </div>

    <div class="tags">
      <div class="tag1">
        <a href="">80K</a>
        <p>Followers</p>
      </div>

      <div class="tag2">
        <a href="">803K</a>
        <p>Likes</p>
      </div>

      <div class="tag3">
        <a href="">1.4K</a>
        <p>Photos</p>
      </div>
    </div>
    
  </section>
</div>
  
  
  

  
</body>
</html>
